<meta charset="UTF-8">

<title>今夜の献立くじ</title>
<style>
  :root {
    --bg: #EEF2F5;

    --sub: #5B6B82;
    --paper: #FFFFFF;
    --accent: #E3A008;
    --line: #C9D3DF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }
  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.2em;
    margin: 0 0 4px;
  }
  .lead { color: var(--sub); margin: 0 0 24px; font-size: 0.95rem; }

  .filters {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin-bottom: 28px; max-width: 520px;
  }
  .filters button {
    font: inherit; font-size: 0.9rem;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }

  .stage {
    height: 340px;
    display: flex; align-items: flex-start; justify-content: center;
    margin-bottom: 16px;
  }
  .slip {
    width: 112px; height: 320px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 10px solid var(--accent);
    box-shadow: 0 6px 18px rgba(27,46,75,0.12);
    display: flex; align-items: center; justify-content: center;
    padding: 20px 0;
    transform-origin: top center;
  }
  .slip .name {
    writing-mode: vertical-rl;
    font-size: 2rem;
    letter-spacing: 0.15em;
    font-weight: 700;
    line-height: 1.3;
  }
  .slip.empty .name { color: var(--sub); font-size: 1.2rem; font-weight: 400; }
  .slip.drop { animation: drop 0.6s cubic-bezier(.2,.8,.3,1.2); }
  @keyframes drop {
    0%   { transform: translateY(-120%) rotate(-4deg); opacity: 0; }
    70%  { transform: translateY(2%) rotate(1deg); opacity: 1; }
    100% { transform: translateY(0) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) { .slip.drop { animation: none; } }

  .draw {
    font: inherit; font-size: 1.15rem; font-weight: 700;
    letter-spacing: 0.15em;
    padding: 14px 40px;
    background: var(--accent); color: var(--ink);
    border: none; border-radius: 6px;
    cursor: pointer;
  }
  .draw:hover { filter: brightness(0.95); }
  .draw:focus-visible, .filters button:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 2px;
  }
  .category { color: var(--sub); margin-top: 14px; min-height: 1.4em; font-size: 0.95rem; }
  .count { color: var(--sub); font-size: 0.8rem; margin-top: 32px; }

  .recipe {
    width: 100%; max-width: 480px;
    margin-top: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 20px;
  }
  .recipe summary {
    cursor: pointer; padding: 12px 0;
    font-weight: 700; letter-spacing: 0.1em;
  }
  .recipe h2 {
    font-size: 1rem; margin: 18px 0 8px;
    padding-left: 10px; border-left: 4px solid var(--accent);
  }
  .recipe ul, .recipe ol { margin: 0 0 16px; padding-left: 1.4em; line-height: 1.8; }
  .recipe li { margin-bottom: 4px; }
  .recipe summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>

  const ALL = "すべて";
  const genres = [ALL, ...new Set(MENUS.map(m => m.genre))];
  let selected = ALL;
  let lastName = "";

  const filtersEl = document.getElementById("filters");
  const slipEl = document.getElementById("slip");
  const nameEl = document.getElementById("name");
  const categoryEl = document.getElementById("category");
  const countEl = document.getElementById("count");

  function poolOf(genre) {
    return genre === ALL ? MENUS : MENUS.filter(m => m.genre === genre);
  }

  function renderFilters() {
    filtersEl.innerHTML = "";
    genres.forEach(g => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = g;
      b.setAttribute("aria-pressed", g === selected ? "true" : "false");
      b.addEventListener("click", () => {
        selected = g;
        renderFilters();
        updateCount();
      });
      filtersEl.appendChild(b);
    });
  }

  function updateCount() {
    countEl.textContent = "くじの中身:" + poolOf(selected).length + "品";
  }

  const recipeEl = document.getElementById("recipe");
  const ingEl = document.getElementById("ing");
  const stepsEl = document.getElementById("steps");

  function fillList(el, items) {
    el.innerHTML = "";
    (items || []).forEach(t => {
      const li = document.createElement("li");
      li.textContent = t;
      el.appendChild(li);
    });
  }

  function showRecipe(m) {
    if (!m.ing || !m.steps) { recipeEl.hidden = true; return; }
    fillList(ingEl, m.ing);
    fillList(stepsEl, m.steps);
    recipeEl.open = false;
    recipeEl.hidden = false;
  }

  function draw() {
    let pool = poolOf(selected);
    // 2回続けて同じ料理にならないようにする
    if (pool.length > 1) pool = pool.filter(m => m.name !== lastName);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    lastName = pick.name;

    nameEl.textContent = pick.name;
    categoryEl.textContent = pick.genre;
    showRecipe(pick);
    slipEl.classList.remove("empty", "drop");
    void slipEl.offsetWidth; // アニメーションをもう一度動かすための記述
    slipEl.classList.add("drop");
  }

  document.getElementById("draw").addEventListener("click", draw);
  renderFilters();
  updateCount();
</script>
